# Auto-deploy to the VPS (Docker) on every push to main, after CI passes.
# Can also be started by hand: GitHub → Actions → Deploy → Run workflow.
#
# One-time set-up on the server (see README → "Auto-deploy"):
#   1. the repo is cloned at DEPLOY_PATH and .env is filled in there (never committed)
#      – put  COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml  in that .env (prod overrides + Caddy HTTPS)
#   2. the server can `git fetch` the repo (read-only deploy key on GitHub, or HTTPS for a public repo)
#   3. a deploy user that can run docker, with the public half of SSH_KEY in ~/.ssh/authorized_keys
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST             server IP or host name
#   SSH_USER             SSH user, e.g. deploy
#   SSH_KEY              private key (ed25519) for that user
#   DEPLOY_PATH          optional (secret or variable), default /srv/boattripthailand
#   SSH_PORT             optional, default 22
#   SSH_KNOWN_HOSTS      optional but recommended: output of  ssh-keyscan -p PORT HOST  (otherwise it is scanned on first use)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time; a newer push waits for the running one instead of cancelling it half-way
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to server
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://new.boattripthailand.com' }}
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.SSH_HOST }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          test -n "$HOST" && test -n "$SSH_KEY" || { echo "::error::SSH_HOST / SSH_KEY secrets are not set"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/known_hosts

      - name: Pull, rebuild and restart
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH || '/srv/boattripthailand' }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes -o ServerAliveInterval=30 "$USER@$HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          if ! git_err=$(git remote get-url origin 2>&1); then
            echo "::error::$DEPLOY_PATH on $(hostname) is not a git clone with an 'origin' remote (user $(whoami)): $git_err — see README → Auto-deploy, or set DEPLOY_PATH"
            ls -la
            exit 1
          fi
          # empty on the very first deploy (git init + remote, nothing checked out yet)
          PREV=$(git rev-parse -q --verify HEAD || true)
          echo "→ current ${PREV:-none (first deploy)} · deploying $SHA"

          # 1. safety copy of the database before anything changes (kept 14 days)
          if [ -n "$PREV" ] && [ -n "$(docker compose ps -q --status running db 2>/dev/null)" ]; then
            mkdir -p "$HOME/backups"
            docker compose exec -T db pg_dump -U btt btt | gzip > "$HOME/backups/btt-$(date +%F-%H%M)-pre-deploy.sql.gz"
            find "$HOME/backups" -name 'btt-*-pre-deploy.sql.gz' -mtime +14 -delete
          else
            echo "→ database not running yet, no backup"
          fi

          # 2. exactly the commit that passed CI (.env and uploads are untracked, so they are kept)
          git fetch --prune origin main || { echo "::error::git fetch failed on the server — the repo is private: add the server's ~/.ssh/github.pub as a read-only Deploy key and use the git@github.com: remote (README → Auto-deploy)"; exit 1; }
          git checkout -q -f -B main "$SHA"

          # 3. build the new image while the old one keeps serving, then swap (migrations run on start)
          docker compose build app
          docker compose up -d --remove-orphans

          # 4. wait for /api/health (app + database); roll back to the previous commit if it never comes up
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3009/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 4
          done
          if [ "$ok" != 1 ]; then
            docker compose logs --tail=80 app || true
            if [ -z "$PREV" ]; then echo "::error::first deploy did not come up healthy — nothing to roll back to, see the app log above"; exit 1; fi
            echo "✗ health check failed — rolling back to $PREV"
            git checkout -q -f -B main "$PREV"
            docker compose build app && docker compose up -d
            exit 1
          fi

          docker image prune -f >/dev/null
          echo "✓ deployed $(git log -1 --format='%h %s')"
          REMOTE

      - name: Check the live site
        if: success()
        env:
          URL: ${{ vars.SITE_URL || 'https://new.boattripthailand.com' }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/health" || true)
            [ "$code" = 200 ] && { echo "✓ $URL is up"; exit 0; }
            sleep 6
          done
          echo "::warning::$URL/api/health answered $code (the server itself is healthy — check DNS / Caddy)"
